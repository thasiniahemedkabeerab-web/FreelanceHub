{% extends "base.html" %}
{% load static %}

{% block title %}Apply Job{% endblock %}

{% block content %}

<section class="dashboard-page">

<div class="container py-5">

    <div class="dashboard-card" style="max-width:700px; margin:auto;">

        <div class="page-header text-center">

            <i class="bi bi-file-earmark-text-fill display-4 text-primary"></i>

            <h2 class="mt-3">Apply for {{ job.title }}</h2>

            <p>Submit your proposal and bid amount for this project.</p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label">Proposal</label>
                {{ form.proposal }}
            </div>

            <div class="mb-4">
                <label class="form-label">Bid Amount (₹)</label>
                {{ form.bid_amount }}
            </div>

            <div class="text-center">

                <button class="apply-btn px-5" type="submit">

                    <i class="bi bi-send-fill"></i>

                    Submit Application

                </button>

            </div>

        </form>

    </div>

</div>

</section>

{% endblock %}
