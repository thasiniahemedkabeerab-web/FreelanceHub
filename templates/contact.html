{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-4">

        <h1>Contact Us</h1>

        <p class="lead">
            We'd love to hear from you.
        </p>

    </div>

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <form>

                        <div class="mb-3">

                            <label>Name</label>

                            <input type="text"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Email</label>

                            <input type="email"
                                   class="form-control">

                        </div>

                        <div class="mb-3">

                            <label>Message</label>

                            <textarea class="form-control"
                                      rows="5"></textarea>

                        </div>

                        <button class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
